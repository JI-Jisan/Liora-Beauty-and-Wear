<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liora Beauty & Wear - Official ID Card (Exact Brand Theme)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      max-width: 800px;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      color: #ff4d6d;
      margin-bottom: 8px;
    }
    p.sub {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.5;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 40px;
      max-width: 1200px;
      width: 100%;
    }
    .card-box {
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 2px solid #ff4d6d;
    }
    .card-header {
      padding: 20px 28px;
      background: #182235;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-header h2 {
      font-size: 22px;
      color: #fce7ec;
    }
    .badge-primary {
      background: #ff4d6d;
      color: white;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .img-wrap {
      padding: 24px;
      display: flex;
      justify-content: center;
      background: #0b1120;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: block;
    }
    .actions {
      padding: 16px 28px;
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      background: #1e293b;
    }
    .btn {
      background: #ff4d6d;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #e11d48;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>✨ LIORA Official ID Card & Ribbon</h1>
    <p class="sub">আপনার আসল লোগো ও সফট পিংক থিমের <strong>১ম অগ্রাধিকার</strong> দিয়ে তৈরি ৩ডি রিয়েলিস্টিক প্রফেশনাল মকআপ</p>
  </div>

  <div class="grid">
    <!-- Main 1st Priority Card -->
    <div class="card-box">
      <div class="card-header">
        <h2>💖 আসল ব্র্যান্ড লোগো ও সফট পিংক থিম (1st Priority)</h2>
        <span class="badge-primary">★ OFFICIAL BRAND THEME ★</span>
      </div>
      <div class="img-wrap">
        <img src="liora_exact_theme_mockup.jpg" alt="LIORA Exact Brand ID Card Mockup">
      </div>
      <div class="actions">
        <a class="btn" href="liora_exact_theme_mockup.jpg" target="_blank" download="liora_exact_id_card.jpg">হাই-রেজুলেশন ছবি ডাউনলোড করুন</a>
        <a class="btn btn-secondary" href="liora_exact_theme_mockup.jpg" target="_blank">ফুলস্ক্রিন দেখুন</a>
      </div>
    </div>
  </div>
</body>
</html>
