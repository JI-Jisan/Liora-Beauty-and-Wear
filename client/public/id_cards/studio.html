<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIORA ID Card Studio - 100% Original Brand Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fdf2f4;
      color: #1e293b;
      overflow-x: hidden;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #fce7ec;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(190, 24, 93, 0.05);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #be185d;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-sub {
      font-size: 12px;
      color: #64748b;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-print { background: #be185d; color: white; box-shadow: 0 4px 12px rgba(190, 24, 93, 0.25); }
    .btn-secondary { background: #ffffff; color: #be185d; border: 1px solid #fbcfe8; }

    .studio-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: calc(100vh - 65px);
    }
    @media (max-width: 980px) {
      .studio-layout { grid-template-columns: 1fr; }
    }

    aside {
      background: #ffffff;
      border-right: 1px solid #fce7ec;
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 65px);
    }
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #fdf2f4;
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: transparent;
      color: #64748b;
      border: none;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #be185d;
      color: white;
    }

    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #475569;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 9px 12px;
      background: #fdf2f4;
      border: 1px solid #fbcfe8;
      border-radius: 6px;
      color: #0f172a;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: #be185d;
      background: #ffffff;
    }

    .canvas-stage {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at center, #fff1f3 0%, #fde8ee 100%);
      overflow-y: auto;
    }

    .cards-row {
      display: flex;
      gap: 50px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* EXACT 100% ORIGINAL CANVAS CARD CONTAINERS */
    .card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-label {
      margin-top: 12px;
      font-size: 13px;
      color: #be185d;
      font-weight: 700;
    }

    .card-canvas {
      width: 332px;
      height: 640px;
      position: relative;
      background-size: 332px 640px;
      background-repeat: no-repeat;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(190, 24, 93, 0.25);
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .card-canvas:hover {
      transform: translateY(-4px);
    }

    #front-canvas {
      background-image: url('front_with_ribbon.png');
    }
    #back-canvas {
      background-image: url('back_with_ribbon.png');
    }

    /* DYNAMIC OVERLAY ELEMENTS (Only active when edited) */
    .overlay-photo {
      position: absolute;
      left: 74px;
      top: 215px;
      width: 184px;
      height: 156px;
      border-radius: 14px;
      object-fit: cover;
      display: none;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 2px solid #be185d;
    }

    .overlay-name {
      position: absolute;
      top: 382px;
      left: 10px;
      width: 312px;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      padding: 2px 0;
      display: none;
      z-index: 10;
    }

    .overlay-des-wrap {
      position: absolute;
      top: 410px;
      left: 0;
      width: 332px;
      text-align: center;
      background: #ffffff;
      padding: 2px 0;
      display: none;
      z-index: 10;
    }
    .overlay-des-pill {
      display: inline-block;
      background: #be185d;
      color: white;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 4px 16px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(190, 24, 93, 0.3);
    }

    .overlay-details-block {
      position: absolute;
      top: 444px;
      left: 55px;
      width: 250px;
      background: #ffffff;
      padding: 4px 6px;
      display: none;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      z-index: 10;
    }
    .overlay-detail-val {
      font-weight: 700;
      color: #0f172a;
      display: inline-block;
      margin-left: 4px;
    }

    .overlay-slogan {
      position: absolute;
      bottom: 22px;
      left: 25px;
      font-family: 'Great Vibes', cursive;
      font-size: 17px;
      color: #be185d;
      background: #fdf2f4;
      padding: 0 4px;
      display: none;
      z-index: 10;
    }

    /* Back Overlays */
    .overlay-contact-block {
      position: absolute;
      top: 215px;
      left: 85px;
      width: 230px;
      background: #ffffff;
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }
    .overlay-contact-item {
      font-size: 10.5px;
      color: #0f172a;
      font-weight: 700;
      line-height: 1.1;
    }

    .overlay-qr {
      position: absolute;
      top: 432px;
      left: 45px;
      width: 58px;
      height: 58px;
      background: white;
      padding: 2px;
      border-radius: 6px;
      display: none;
      z-index: 10;
      border: 1px solid #fecdd3;
    }

    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .studio-layout { display: block !important; }
      .canvas-stage { padding: 0 !important; background: white !important; }
      .cards-row { gap: 20px !important; }
      .card-canvas { box-shadow: none !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <div class="brand-info">
      <div class="brand-title"><span>🪪</span> LIORA ID Card Studio</div>
      <div class="brand-sub">আপনার আসল মাস্টার টেমপ্লেটের সাথে ১০০% হুবহু লাইভ এডিটর</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন (Print)</button>
      <button class="btn btn-secondary" onclick="resetToOriginal()">↺ মূল ডিজাইনে রিসেট</button>
    </div>
  </header>

  <div class="studio-layout">
    <!-- Left Inspector Sidebar -->
    <aside class="no-print">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('info', this)">তথ্য</button>
        <button class="tab-btn" onclick="switchTab('photo', this)">ছবি</button>
        <button class="tab-btn" onclick="switchTab('back', this)">পেছন</button>
        <button class="tab-btn" onclick="switchTab('roles', this)">রোলস</button>
      </div>

      <!-- TAB 1: BASIC INFO -->
      <div id="tab-info">
        <div class="form-group">
          <label>কর্মচারীর নাম (Full Name)</label>
          <input type="text" id="inp-name" value="Jahidul Islam Jisan" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>পদবী (Designation)</label>
          <input type="text" id="inp-des" value="MANAGING DIRECTOR (MD)" oninput="applyCustomOverlay()">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label>এমপ্লয়ি আইডি (ID)</label>
            <input type="text" id="inp-id" value="LIORA-001" oninput="applyCustomOverlay()">
          </div>
          <div class="form-group">
            <label>রক্তের গ্রুপ</label>
            <select id="inp-blood" onchange="applyCustomOverlay()">
              <option value="O+" selected>O+</option>
              <option value="A+">A+</option>
              <option value="B+">B+</option>
              <option value="AB+">AB+</option>
              <option value="O-">O-</option>
              <option value="A-">A-</option>
              <option value="B-">B-</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>ডিপার্টমেন্ট (Department)</label>
          <input type="text" id="inp-dept" value="Management & Marketing" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>যোগদানের তারিখ (Joining Date)</label>
          <input type="text" id="inp-date" value="01 Aug 2025" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>স্লোগান / মটো (Slogan)</label>
          <input type="text" id="inp-slogan" value="Together We Grow ♥" oninput="applyCustomOverlay()">
        </div>
      </div>

      <!-- TAB 2: PHOTO -->
      <div id="tab-photo" style="display: none;">
        <div class="form-group">
          <label>পাসপোর্ট সাইজ ছবি পরিবর্তন করুন</label>
          <input type="file" id="inp-file" accept="image/*" onchange="handlePhotoUpload(event)">
        </div>
        <p style="font-size: 11.5px; color: #64748b; line-height: 1.4;">
          কম্পিউটার বা মোবাইল থেকে যেকোনো স্টাফের ছবি আপলোড করলেই ফটো ফ্রেমে লাইভ সেট হয়ে যাবে।
        </p>
        <div style="text-align: center; margin-top: 15px;">
          <button class="btn btn-secondary" style="margin: 0 auto;" onclick="resetPhoto()">আসল জিসান সাহেবের ছবি ফিরিয়ে আনুন</button>
        </div>
      </div>

      <!-- TAB 3: BACK SIDE -->
      <div id="tab-back" style="display: none;">
        <div class="form-group">
          <label>অফিশিয়াল কন্টাক্ট</label>
          <input type="text" id="inp-contact" value="+880 1712 345678" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>ইমেইল</label>
          <input type="text" id="inp-email" value="liorabeautyandwear@gmail.com" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>ফেসবুক পেজ</label>
          <input type="text" id="inp-fb" value="Liora Beauty and Wear" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>ওয়েবসাইট</label>
          <input type="text" id="inp-web" value="liorabeautyandwear.com" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>অফিস ঠিকানা</label>
          <input type="text" id="inp-addr" value="Rayerbag, Dhaka, Bangladesh" oninput="applyCustomOverlay()">
        </div>
        <div class="form-group">
          <label>কিউআর কোড টার্গেট লিংক</label>
          <input type="text" id="inp-qr" value="https://liorabeautyandwear.com" oninput="updateQrOverlay()">
        </div>
      </div>

      <!-- TAB 4: ROLES PRESETS -->
      <div id="tab-roles" style="display: none;">
        <p style="font-size: 12px; color: #64748b; margin-bottom: 12px;">১-ক্লিকে যেকোনো স্টাফের রোল অ্যাপ্লাই করুন:</p>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button class="btn" style="background: #fdf2f4; border: 1px solid #fbcfe8; color: #be185d; width: 100%; text-align: left; justify-content: space-between;" onclick="applyRole('Jahidul Islam Jisan', 'MANAGING DIRECTOR (MD)', 'LIORA-001', 'Management & Marketing', 'O+', '01 Aug 2025', 'Together We Grow ♥')">
            <span>👑 Managing Director (MD)</span> <span>→</span>
          </button>
          <button class="btn" style="background: #fdf2f4; border: 1px solid #fbcfe8; color: #be185d; width: 100%; text-align: left; justify-content: space-between;" onclick="applyRole('Nusrat Jahan', 'SHOWROOM MANAGER', 'LIORA-012', 'Retail & Operations', 'A+', '15 Oct 2025', 'Excellence in Service ♥')">
            <span>🏬 Showroom Manager</span> <span>→</span>
          </button>
          <button class="btn" style="background: #fdf2f4; border: 1px solid #fbcfe8; color: #be185d; width: 100%; text-align: left; justify-content: space-between;" onclick="applyRole('Fatema Tuz Zohra', 'BEAUTY CONSULTANT', 'LIORA-025', 'Customer Experience', 'B+', '01 Jan 2026', 'Glow with Confidence ♥')">
            <span>💄 Beauty Consultant</span> <span>→</span>
          </button>
          <button class="btn" style="background: #fdf2f4; border: 1px solid #fbcfe8; color: #be185d; width: 100%; text-align: left; justify-content: space-between;" onclick="applyRole('Md. Rakib Hasan', 'DELIVERY HERO', 'LIORA-042', 'Logistics & Supply', 'O+', '10 Feb 2026', 'Fast & Safe Delivery ♥')">
            <span>🚚 Delivery Hero</span> <span>→</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Right Live Canvas Stage -->
    <main class="canvas-stage">
      <div class="cards-row">
        <!-- FRONT CARD -->
        <div class="card-wrap">
          <div class="card-canvas" id="front-canvas">
            <!-- Dynamic Overlays (Only visible when user changes values) -->
            <img id="overlay-photo" class="overlay-photo" src="" alt="Custom Portrait">
            <div id="overlay-name" class="overlay-name"></div>
            <div id="overlay-des-wrap" class="overlay-des-wrap">
              <span id="overlay-des-pill" class="overlay-des-pill"></span>
            </div>
            <div id="overlay-details" class="overlay-details-block">
              <div><span class="overlay-detail-val" id="val-id"></span></div>
              <div><span class="overlay-detail-val" id="val-dept"></span></div>
              <div><span class="overlay-detail-val" id="val-blood"></span></div>
              <div><span class="overlay-detail-val" id="val-date"></span></div>
            </div>
            <div id="overlay-slogan" class="overlay-slogan"></div>
          </div>
          <div class="card-label no-print">সামনের অংশ (Front Side)</div>
        </div>

        <!-- BACK CARD -->
        <div class="card-wrap">
          <div class="card-canvas" id="back-canvas">
            <div id="overlay-contacts" class="overlay-contact-block">
              <div class="overlay-contact-item" id="val-contact"></div>
              <div class="overlay-contact-item" id="val-email"></div>
              <div class="overlay-contact-item" id="val-fb"></div>
              <div class="overlay-contact-item" id="val-web"></div>
              <div class="overlay-contact-item" id="val-addr"></div>
            </div>
            <div id="overlay-qr" class="overlay-qr"></div>
          </div>
          <div class="card-label no-print">পেছনের অংশ (Back Side)</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let qrObj = null;

    function switchTab(name, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      ['info', 'photo', 'back', 'roles'].forEach(t => {
        document.getElementById("tab-" + t).style.display = t === name ? "block" : "none";
      });
    }

    function applyCustomOverlay() {
      const name = document.getElementById("inp-name").value;
      const des = document.getElementById("inp-des").value;
      const id = document.getElementById("inp-id").value;
      const dept = document.getElementById("inp-dept").value;
      const blood = document.getElementById("inp-blood").value;
      const date = document.getElementById("inp-date").value;
      const slogan = document.getElementById("inp-slogan").value;

      // If user modified from default, show overlays
      const isOriginal = name === "Jahidul Islam Jisan" && des === "MANAGING DIRECTOR (MD)" && id === "LIORA-001";

      const nameEl = document.getElementById("overlay-name");
      const desWrap = document.getElementById("overlay-des-wrap");
      const desPill = document.getElementById("overlay-des-pill");
      const detailsEl = document.getElementById("overlay-details");
      const sloganEl = document.getElementById("overlay-slogan");

      if (isOriginal) {
        nameEl.style.display = "none";
        desWrap.style.display = "none";
        detailsEl.style.display = "none";
        sloganEl.style.display = "none";
      } else {
        nameEl.textContent = name;
        nameEl.style.display = "block";

        desPill.textContent = des;
        desWrap.style.display = "block";

        document.getElementById("val-id").textContent = id;
        document.getElementById("val-dept").textContent = dept;
        document.getElementById("val-blood").textContent = blood;
        document.getElementById("val-date").textContent = date;
        detailsEl.style.display = "flex";

        sloganEl.textContent = slogan;
        sloganEl.style.display = "block";
      }

      // Back Overlays
      const contact = document.getElementById("inp-contact").value;
      const email = document.getElementById("inp-email").value;
      const fb = document.getElementById("inp-fb").value;
      const web = document.getElementById("inp-web").value;
      const addr = document.getElementById("inp-addr").value;

      const isBackOriginal = contact === "+880 1712 345678" && email === "liorabeautyandwear@gmail.com";
      const contactsEl = document.getElementById("overlay-contacts");

      if (isBackOriginal) {
        contactsEl.style.display = "none";
      } else {
        document.getElementById("val-contact").textContent = contact;
        document.getElementById("val-email").textContent = email;
        document.getElementById("val-fb").textContent = fb;
        document.getElementById("val-web").textContent = web;
        document.getElementById("val-addr").textContent = addr;
        contactsEl.style.display = "flex";
      }
    }

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const photoEl = document.getElementById("overlay-photo");
          photoEl.src = evt.target.result;
          photoEl.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    function resetPhoto() {
      const photoEl = document.getElementById("overlay-photo");
      photoEl.style.display = "none";
      photoEl.src = "";
    }

    function resetToOriginal() {
      document.getElementById("inp-name").value = "Jahidul Islam Jisan";
      document.getElementById("inp-des").value = "MANAGING DIRECTOR (MD)";
      document.getElementById("inp-id").value = "LIORA-001";
      document.getElementById("inp-blood").value = "O+";
      document.getElementById("inp-dept").value = "Management & Marketing";
      document.getElementById("inp-date").value = "01 Aug 2025";
      document.getElementById("inp-slogan").value = "Together We Grow ♥";
      resetPhoto();
      applyCustomOverlay();
    }

    function applyRole(name, des, id, dept, blood, date, slogan) {
      document.getElementById("inp-name").value = name;
      document.getElementById("inp-des").value = des;
      document.getElementById("inp-id").value = id;
      document.getElementById("inp-dept").value = dept;
      document.getElementById("inp-blood").value = blood;
      document.getElementById("inp-date").value = date;
      document.getElementById("inp-slogan").value = slogan;
      applyCustomOverlay();
      alert("'" + des + "' রোল অ্যাপ্লাই করা হয়েছে!");
    }

    function updateQrOverlay() {
      const qrVal = document.getElementById("inp-qr").value;
      const isQrOriginal = qrVal === "https://liorabeautyandwear.com";
      const qrEl = document.getElementById("overlay-qr");

      if (isQrOriginal) {
        qrEl.style.display = "none";
      } else {
        qrEl.innerHTML = "";
        qrEl.style.display = "block";
        new QRCode(qrEl, {
          text: qrVal,
          width: 54,
          height: 54,
          colorDark: "#1e293b",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }
  </script>
</body>
</html>
