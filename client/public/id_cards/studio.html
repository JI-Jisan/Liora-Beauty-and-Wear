<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIORA ID Card Studio - Exact Reference Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8e6ea;
      color: #1e293b;
      overflow-x: hidden;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #fce7ec;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(190, 24, 93, 0.05);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #be185d;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-sub {
      font-size: 12px;
      color: #64748b;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-print { background: #be185d; color: white; box-shadow: 0 4px 12px rgba(190, 24, 93, 0.25); }
    .btn-secondary { background: #ffffff; color: #be185d; border: 1px solid #fbcfe8; }

    .studio-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: calc(100vh - 65px);
    }
    @media (max-width: 980px) {
      .studio-layout { grid-template-columns: 1fr; }
    }

    aside {
      background: #ffffff;
      border-right: 1px solid #fce7ec;
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 65px);
    }
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: #fdf2f4;
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: transparent;
      color: #64748b;
      border: none;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #be185d;
      color: white;
    }

    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #475569;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 9px 12px;
      background: #fdf2f4;
      border: 1px solid #fbcfe8;
      border-radius: 6px;
      color: #0f172a;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: #be185d;
      background: #ffffff;
    }

    /* PREVIEW STAGE (Realistic Studio Pink Background) */
    .canvas-stage {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at center, #fcecee 0%, #f6dbe2 100%);
      overflow-y: auto;
    }

    .view-mode-toggle {
      display: flex;
      gap: 8px;
      background: white;
      padding: 4px;
      border-radius: 30px;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(190, 24, 93, 0.1);
      border: 1px solid #fbcfe8;
    }
    .mode-btn {
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #be185d;
      color: white;
      box-shadow: 0 2px 8px rgba(190, 24, 93, 0.25);
    }

    .cards-row {
      display: flex;
      gap: 50px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* CARD PRESENTATION */
    .card-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hanging Lanyard Ribbon & Clip */
    .strap-wrap {
      width: 44px;
      height: 75px;
      background: linear-gradient(180deg, #c02656 0%, #9d174d 100%);
      border-radius: 4px 4px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(190, 24, 93, 0.3);
      position: relative;
      z-index: 2;
    }
    .strap-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      color: white;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
    }
    .metal-clip {
      width: 32px;
      height: 16px;
      background: linear-gradient(180deg, #94a3b8, #cbd5e1, #64748b);
      border-radius: 4px;
      margin-bottom: -4px;
      z-index: 3;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* PURE VECTOR CARD CONTAINER */
    .card-box {
      width: 330px;
      height: 555px;
      border-radius: 22px;
      box-shadow: 0 25px 50px -10px rgba(190, 24, 93, 0.3), 0 0 0 1px rgba(254, 205, 211, 0.5);
      overflow: hidden;
      position: relative;
      background: #ffffff;
    }

    .label-badge {
      margin-top: 14px;
      font-size: 13px;
      color: #be185d;
      font-weight: 700;
    }

    /* Original Photo View */
    #view-original-mode {
      display: none;
      max-width: 900px;
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(190, 24, 93, 0.35);
      border: 2px solid #fecdd3;
    }

    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .studio-layout { display: block !important; }
      .canvas-stage { padding: 0 !important; background: white !important; }
      .cards-row { gap: 20px !important; }
      .card-box { box-shadow: none !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>
  <header class="no-print">
    <div class="brand-info">

    </div>

  <div class="studio-layout">

        <div class="form-group">

          <input type="text" id="inp-name" value="Jahidul Islam Jisan" oninput="updateSvg()">
        </div>
        <div class="form-group">
          <label>পদবী (Designation)</label>
          <input type="text" id="inp-des" value="MANAGING DIRECTOR (MD)" oninput="updateSvg()">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">

            <input type="text" id="inp-id" value="LIORA-001" oninput="updateSvg()">
          </div>
          <div class="form-group">
            <label>রক্তের গ্রুপ</label>
            <select id="inp-blood" onchange="updateSvg()">

              <option value="A+">A+</option>

        <div class="form-group">
          <label>স্লোগান (Slogan)</label>

        <div style="display: flex; flex-direction: column; gap: 8px;">

  <script>
    let qrObj = null;

    function switchTab(name, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      ['info', 'photo', 'back', 'roles'].forEach(t => {
        document.getElementById("tab-" + t).style.display = t === name ? "block" : "none";
      });
    }

    function toggleMode(mode) {
      const liveMode = document.getElementById("view-live-mode");
      const origMode = document.getElementById("view-original-mode");
      const btnLive = document.getElementById("btn-live-mode");
      const btnOrig = document.getElementById("btn-orig-mode");

      if (mode === 'orig') {
        liveMode.style.display = "none";
        origMode.style.display = "block";
        btnLive.classList.remove("active");
        btnOrig.classList.add("active");
      } else {
        liveMode.style.display = "flex";
        origMode.style.display = "none";
        btnLive.classList.add("active");
        btnOrig.classList.remove("active");
      }
    }

    function updateSvg() {
      // Front
      document.getElementById("svg-name").textContent = document.getElementById("inp-name").value;
      document.getElementById("svg-des").textContent = document.getElementById("inp-des").value;
      document.getElementById("svg-id").textContent = document.getElementById("inp-id").value;
      document.getElementById("svg-dept").textContent = document.getElementById("inp-dept").value;
      document.getElementById("svg-blood").textContent = document.getElementById("inp-blood").value;
      document.getElementById("svg-date").textContent = document.getElementById("inp-date").value;
      document.getElementById("svg-slogan").textContent = document.getElementById("inp-slogan").value;

      // Back
      document.getElementById("svg-contact").textContent = document.getElementById("inp-contact").value;
      document.getElementById("svg-email").textContent = document.getElementById("inp-email").value;
      document.getElementById("svg-fb").textContent = document.getElementById("inp-fb").value;
      document.getElementById("svg-web").textContent = document.getElementById("inp-web").value;
      document.getElementById("svg-addr").textContent = document.getElementById("inp-addr").value;
    }

    function initQrSvg() {
      const el = document.getElementById("svg-qrcode-container");
      el.innerHTML = "";
      qrObj = new QRCode(el, {
        text: document.getElementById("inp-qr").value || "https://liorabeautyandwear.com",
        width: 66,
        height: 66,
        colorDark: "#1e293b",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function updateQrSvg() {
      if (qrObj) {
        qrObj.clear();
        qrObj.makeCode(document.getElementById("inp-qr").value);
      }
    }

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById("svg-photo").setAttribute("href", evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function resetPhoto() {
      document.getElementById("svg-photo").setAttribute("href", "jisan_portrait.jpg");
    }

    function resetToOriginal() {
      document.getElementById("inp-name").value = "Jahidul Islam Jisan";
      document.getElementById("inp-des").value = "MANAGING DIRECTOR (MD)";
      document.getElementById("inp-id").value = "LIORA-001";
      document.getElementById("inp-blood").value = "O+";
      document.getElementById("inp-dept").value = "Management & Marketing";
      document.getElementById("inp-date").value = "01 Aug 2025";
      document.getElementById("inp-slogan").value = "Together We Grow ♥";
      document.getElementById("inp-contact").value = "+880 1712 345678";
      document.getElementById("inp-email").value = "liorabeautyandwear@gmail.com";
      document.getElementById("inp-fb").value = "Liora Beauty and Wear";
      document.getElementById("inp-web").value = "liorabeautyandwear.com";
      document.getElementById("inp-addr").value = "Rayerbag, Dhaka, Bangladesh";
      document.getElementById("inp-qr").value = "https://liorabeautyandwear.com";
      resetPhoto();
      updateSvg();
      updateQrSvg();
    }

    function applyRole(name, des, id, dept, blood, date, slogan) {
      document.getElementById("inp-name").value = name;
      document.getElementById("inp-des").value = des;
      document.getElementById("inp-id").value = id;
      document.getElementById("inp-dept").value = dept;
      document.getElementById("inp-blood").value = blood;
      document.getElementById("inp-date").value = date;
      document.getElementById("inp-slogan").value = slogan;
      updateSvg();
      alert("'" + des + "' রোল অ্যাপ্লাই করা হয়েছে!");
    }

    window.onload = function() {
      initQrSvg();
      updateSvg();
    };
