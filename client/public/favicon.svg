<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&amp;family=Montserrat:wght@700&amp;family=Great+Vibes&amp;display=swap');
      .top-sub {
        font-family: 'Montserrat', sans-serif;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 12px;
        fill: #0f172a;
        text-anchor: middle;
      }
      .brand-main {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 130px;
        font-weight: 800;
        letter-spacing: 8px;
        fill: #ff4d6d;
        text-anchor: middle;
      }
      .script-text {
        font-family: 'Great Vibes', cursive, serif;
        font-size: 78px;
        font-style: italic;
        fill: #ff4d6d;
        text-anchor: middle;
      }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean white rounded badge so it is visible in both dark and light browser tabs -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="#ffffff" stroke="#ffccd5" stroke-width="8" filter="url(#shadow)"/>

  <!-- Top Tracking Subtitle -->
  <text x="256" y="125" class="top-sub">BEAUTY &amp; WEAR</text>

  <!-- Main Brand Title LIORA -->
  <text x="256" y="260" class="brand-main">LIORA</text>

  <!-- Left Ornamental Line with Diamond -->
  <path d="M 40 315 L 130 315" stroke="#ff4d6d" stroke-width="3" />
  <polygon points="40,315 48,310 56,315 48,320" fill="#ff4d6d" />

  <!-- Bottom Script Text: Beauty & Wear -->
  <text x="256" y="340" class="script-text">Beauty &amp; Wear</text>

  <!-- Right Ornamental Line with Diamond -->
  <path d="M 382 315 L 472 315" stroke="#ff4d6d" stroke-width="3" />
  <polygon points="472,315 464,310 456,315 464,320" fill="#ff4d6d" />
</svg>